<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trạng Nguyên Tiếng Việt 4 - Đề thi thử 02</title><style>
:root{--navy:#123b66;--blue:#1769aa;--sky:#eaf6ff;--mint:#e8f7f3;--teal:#13877d;--gold:#f4bd42;--ink:#23364a;--muted:#6c7d8d;--line:#dbe6ef;--white:#fff;--danger:#c44444;--success:#16845d;--shadow:0 12px 32px rgba(24,67,105,.10)}
*{box-sizing:border-box}html{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%;font-synthesis:none}body{margin:0;background:linear-gradient(135deg,#edf7ff,#f8fcff 48%,#eef9f5);font-family:inherit;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}button,input{font:inherit}.app{max-width:1240px;margin:auto;padding:24px 18px 42px}.brand{text-align:center;color:var(--teal);font-weight:900;letter-spacing:2px;margin-bottom:10px}.hero{text-align:center;margin:8px 0 24px}.hero h1{margin:0;color:var(--navy);font-size:clamp(25px,4vw,39px);font-weight:900}.hero .sub{color:#52738d;font-weight:700}.panel{background:#fff;border:1px solid #dfeaf2;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.start-panel{max-width:780px;margin:auto}.panel-head{padding:20px 25px;background:linear-gradient(100deg,#eaf6ff,#e9f8f4);border-bottom:1px solid var(--line)}.panel-head h2{margin:0;color:var(--navy)}.panel-body{padding:24px 26px}.field-label{display:block;font-weight:800;margin-bottom:8px}.text-input{width:100%;border:1.5px solid #cbdce8;border-radius:12px;padding:13px;background:#fff}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.setting{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:8px}.setting input{accent-color:var(--teal)}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#1769aa,#13877d);color:#fff}.secondary{background:#fff;border:1px solid #bcd4e6;color:var(--navy)}.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.action-row .btn{flex:1}.game-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.side,.main{padding:18px}.progress{height:9px;background:#e8f0f5;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0}.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.nav-grid button{border:1px solid var(--line);background:#f8fbfd;border-radius:9px;padding:9px 2px;font-weight:800;cursor:pointer}.nav-grid button.done{background:#e4f6ed;border-color:#9bd4b7}.nav-grid button.active{background:#1769aa;color:white}.question-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.q-number{background:#eaf6ff;color:var(--navy);padding:7px 12px;border-radius:999px;font-weight:900}.question-prompt{font-size:18px;line-height:1.65;font-weight:650;margin:12px 0 18px}.question-prompt small{font-weight:500}.q-media{display:block;max-width:min(100%,620px);max-height:330px;object-fit:contain;margin:14px auto;border-radius:12px;border:1px solid #e1ebf1}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);padding:13px;border-radius:13px;cursor:pointer;background:#fbfdff}.option.selected{border-color:#1769aa;background:#edf7ff}.option input{margin-top:4px;accent-color:#1769aa}.option-letter{font-weight:900;color:var(--blue)}.answer-line{margin:12px 0}.answer-line input{max-width:420px}.inline-input{display:inline-block;width:130px;padding:7px}.subpart-list{display:grid;gap:12px}.subpart-list .answer-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.feedback{padding:12px 14px;border-radius:12px;margin-top:16px;background:#f1faf5;border:1px solid #bfe3ce}.feedback.wrong{background:#fff5f4;border-color:#efc5c1}.question-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.question-actions .btn{flex:1}.match-board{display:grid;grid-template-columns:1fr 1fr;gap:28px;position:relative}.match-col{display:grid;gap:10px;align-content:start}.match-card{border:1.5px solid #bcd4e6;background:#e8f7f3;border-radius:12px;padding:14px;min-height:56px;cursor:pointer;position:relative;z-index:2;touch-action:manipulation}.match-card.selected{outline:3px solid #f4bd42;background:#fff8e4}.match-card.matched{border-color:#16845d}.match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}.match-svg line{stroke:#16845d;stroke-width:3;stroke-linecap:round}.match-board{min-height:180px}.match-help,.help{font-size:13px;color:#61778a;margin:8px 0 12px}.group-bank{border:2px dashed #cbdce8;border-radius:14px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #cbdce8;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;user-select:none;touch-action:manipulation}.chip.selected{background:#fff3d6;border-color:#d49a20}.group-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dropzone{border:1.5px solid #b9c9c6;border-radius:16px;min-height:125px;padding:12px;background:#fbfefd}.dropzone h4{margin:0 0 10px;color:var(--teal)}.dropzone .chip{display:inline-block;margin:3px}.order-list{display:flex;gap:9px;flex-wrap:wrap;padding:14px;background:#e1f3f0;border:1px solid #bdd7d2;border-radius:12px}.order-item{padding:10px 13px;background:white;border:1px dashed #c98f8f;border-radius:8px;cursor:grab;touch-action:manipulation;font-weight:800}.order-item.selected{background:#fff3d6;border-color:#d49a20}.result-score{font-size:36px;font-weight:1000;color:var(--teal)}.muted{color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){.game-layout{grid-template-columns:1fr}.side{order:2}.option-grid{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.match-board{gap:12px}.panel-body{padding:17px}.app{padding:14px 10px 30px}}@media(max-width:480px){.group-grid{grid-template-columns:1fr}.match-card{padding:10px 8px;font-size:14px}.nav-grid{grid-template-columns:repeat(6,1fr)}}

.image-option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch;margin:14px 0}
.image-option{position:relative;display:flex;align-items:center;justify-content:center;min-height:190px;padding:10px;background:#fbfdff;border:2px solid var(--line);border-radius:15px;cursor:pointer;transition:.18s ease}
.image-option:hover{border-color:#8fb7d4;transform:translateY(-2px)}
.image-option.selected{border-color:var(--blue);background:#edf7ff;box-shadow:0 0 0 3px rgba(23,105,170,.12)}
.image-option input{position:absolute;opacity:0;pointer-events:none}
.image-option img{display:block;width:100%;height:220px;object-fit:contain;border-radius:9px}
.inline-input{display:inline-block;vertical-align:baseline;width:112px;max-width:30vw;height:38px;margin:0 4px;padding:4px 7px;border:1.5px solid #8eb8d0;border-radius:8px;background:#fff;text-align:center;font-weight:800;color:var(--navy)}
.inline-input:focus{outline:3px solid rgba(23,105,170,.14);border-color:var(--blue)}
.match-image{display:block;max-width:100%;width:auto;height:112px;object-fit:contain;margin:auto;border-radius:8px}
.match-card{display:flex;align-items:center;justify-content:center;text-align:center;min-height:112px;padding:10px 12px;user-select:none}
.match-card[data-side="left"]{touch-action:none}
.match-col{gap:12px}
.match-svg line{stroke:#13877d;stroke-width:3.2;stroke-linecap:round}
.match-svg .temp-line{stroke:#e49a17;stroke-dasharray:7 5;stroke-width:3}
.dropzone{transition:background .15s,border-color .15s}
.dropzone:has(.chip.selected){border-color:#d49a20;background:#fffaf0}
.group-bank{min-height:64px}
@media(max-width:650px){.image-option-grid{grid-template-columns:1fr}.image-option{min-height:145px}.image-option img{height:180px}.match-board{gap:10px}.match-image{height:90px}.match-card{min-height:96px;padding:8px 5px}.inline-input{width:90px;height:35px}}

/* ===== Tối ưu khả năng đọc cho học sinh lớp 1 ===== */
body{font-size:19px;line-height:1.55}
.app{max-width:1360px;padding:26px 22px 48px}
.hero{margin:12px 0 28px}
.hero h1{font-size:clamp(29px,4.2vw,46px);line-height:1.25}
.hero .sub{font-size:clamp(18px,2vw,22px);line-height:1.4;margin-top:8px}
.panel{border-radius:24px}
.panel-head{padding:22px 28px}
.panel-head h2{font-size:26px;line-height:1.4}
.panel-body{padding:28px 30px}
.field-label{font-size:21px;line-height:1.45}
.text-input{font-size:21px;line-height:1.4;min-height:58px;padding:15px 17px}
.settings{gap:14px;margin:22px 0}
.setting{font-size:19px;line-height:1.45;padding:15px 16px;align-items:center}
.setting input{width:22px;height:22px;flex:0 0 auto}
.btn{font-size:19px;line-height:1.35;min-height:58px;padding:15px 20px}
.help,.match-help{font-size:16px;line-height:1.6}
.game-layout{grid-template-columns:290px minmax(0,1fr);gap:22px}
.side,.main{padding:24px}

.nav-grid{gap:9px}
.nav-grid button{min-height:48px;font-size:17px;border-radius:10px}
.question-heading{margin-bottom:18px}
.q-number{font-size:20px;padding:9px 15px}
.question-heading .muted{font-size:18px}
.question-prompt{font-size:clamp(23px,2.1vw,28px);line-height:1.7;font-weight:750;margin:18px 0 24px;color:#172f48}
.q-media{max-width:min(100%,720px);max-height:430px;margin:20px auto;border-radius:16px}
.option-grid{gap:14px}
.option{min-height:72px;padding:17px 19px;font-size:21px;line-height:1.55;align-items:center;border-width:2px;border-radius:15px}
.option input{width:20px;height:20px;transform:scale(1.2);transform-origin:center;margin:0 5px 0 0;flex:0 0 auto}
.option-letter{font-size:21px}
.answer-line{font-size:21px;line-height:1.6}
.inline-input{width:145px;max-width:34vw;height:48px;font-size:21px;margin:3px 6px;padding:6px 10px}
.subpart-list{gap:16px}
.match-board{gap:34px}
.match-col{gap:15px}
.match-card{font-size:20px;line-height:1.5;min-height:126px;padding:15px;border-radius:15px}
.match-image{height:132px}
.match-help{font-size:17px;margin:10px 0 16px}
.group-bank{min-height:82px;padding:16px;gap:12px}
.chip{font-size:21px;line-height:1.4;min-height:50px;padding:12px 17px;border-radius:10px}
.group-grid{gap:16px}
.dropzone{min-height:155px;padding:16px;border-width:2px;border-radius:18px}
.dropzone h4{font-size:21px;line-height:1.45;margin:0 0 13px}
.dropzone .chip{margin:5px}
.order-list{gap:12px;padding:16px}
.order-item{font-size:21px;line-height:1.4;padding:13px 17px}
.feedback{font-size:18px;line-height:1.6;padding:16px 18px}
.result-score{font-size:42px}
.question-actions{gap:13px;margin-top:24px}
.question-actions .btn{min-height:60px;font-size:18px}
@media(max-width:900px){
  .game-layout{grid-template-columns:1fr}
  .side{order:2}
  .main{order:1}
  .option-grid{grid-template-columns:1fr}
  .settings{grid-template-columns:1fr}
  .group-grid{grid-template-columns:1fr}
}
@media(max-width:650px){
  .app{padding:13px 10px 28px}
  .hero{margin:10px 0 18px}
  .hero h1{font-size:27px}
  .hero .sub{font-size:18px}
  .panel-head{padding:17px 18px}
  .panel-head h2{font-size:22px}
  .panel-body{padding:17px}
  .side,.main{padding:16px}
  .question-prompt{font-size:23px;line-height:1.65;margin:15px 0 19px}
  .option{font-size:20px;min-height:67px;padding:15px 16px}
  .option-letter{font-size:20px}
  .q-media{max-height:330px}
  .match-board{gap:10px}
  .match-card{font-size:18px;min-height:100px;padding:9px 7px}
  .match-image{height:95px}
  .inline-input{width:106px;min-width:92px;height:44px;font-size:19px}
  .chip,.order-item{font-size:19px;padding:11px 13px}
  .dropzone{min-height:135px;padding:12px}
  .dropzone h4{font-size:19px}
  .question-actions{display:grid;grid-template-columns:1fr 1fr}
  .question-actions #checkBtn{grid-column:1/-1;grid-row:1}
  .question-actions .btn{font-size:16px;padding:12px 10px;min-height:54px}
}
@media(max-width:390px){
  .hero h1{font-size:24px}
  .question-prompt{font-size:21px}
  .option{font-size:19px;gap:8px}
  .match-board{gap:7px}
  .match-card{font-size:16px}
  .match-image{height:82px}
}


/* ===== Bổ sung tương tác kéo thả từ vào chỗ trống cho Câu 30 ===== */
.dragfill-list{display:grid;gap:13px;margin:14px 0}
.dragfill-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:21px;line-height:1.5}
.dragfill-slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:48px;padding:5px 10px;border:2px dashed #9bbbc7;border-radius:10px;background:#f7fcfc;color:var(--navy);font-weight:800}
.dragfill-slot.filled{border-style:solid;border-color:var(--teal);background:#e8f7f3}
.dragfill-bank{display:flex;gap:9px;flex-wrap:wrap;padding:14px;background:#e1f3f0;border:1px solid #bdd7d2;border-radius:12px;margin-top:14px}
.dragfill-chip{padding:9px 14px;background:#fff;border:1px dashed #c98f8f;border-radius:8px;cursor:grab;touch-action:manipulation;font-weight:800}
.dragfill-chip.selected{background:#fff3d6;border-color:#d49a20}
@media(max-width:650px){.dragfill-row{font-size:19px}.dragfill-slot{min-width:100px;min-height:44px}.dragfill-chip{font-size:18px;padding:9px 12px}}

/* ===== Thiết lập an toàn cho màn hình, trình duyệt và thao tác cảm ứng ===== */
html{
  min-width:320px;
  font-family:"TNTV Noto Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Tahoma,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  width:100%;
  max-width:100%;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overflow-wrap:break-word;
  font-family:"TNTV Noto Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Tahoma,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-synthesis:none;
}
button,input,textarea,select{
  font-family:inherit;
  font-size:inherit;
  max-width:100%;
}
img,svg{max-width:100%;}
.app{width:100%;max-width:1360px;margin-inline:auto;}
.game-layout{grid-template-columns:minmax(0,290px) minmax(0,1fr);}
.side,.main,.panel,.panel-body,.question-prompt,.option,.feedback,.match-col,.match-card,.dropzone{min-width:0;}
.question-prompt,.option,.feedback,.help,.match-card,.dropzone,.chip,.order-item,.dragfill-row{
  overflow-wrap:anywhere;
  word-break:normal;
}
.text-input,.inline-input{min-width:0;max-width:100%;}
.btn,.option,.image-option,.match-card,.chip,.order-item,.dropzone{
  -webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation;}

/* Máy tính bảng và màn hình trung bình */
@media (min-width:901px) and (max-width:1100px){
  .app{padding:20px 16px 34px;}
  .game-layout{grid-template-columns:250px minmax(0,1fr);gap:15px;}
  .side,.main{padding:18px;}
  .image-option-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .question-prompt{font-size:clamp(21px,2.5vw,26px);}
}
@media (max-width:900px){
  .game-layout{grid-template-columns:minmax(0,1fr);}
  .image-option-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* Điện thoại và màn hình hẹp */
@media (max-width:650px){
  .app{width:100%;padding:12px 8px 24px;}
  .game-layout{grid-template-columns:minmax(0,1fr);}
  .hero{margin:8px 0 16px;}
  .hero h1{font-size:clamp(22px,6vw,28px);overflow-wrap:anywhere;}
  .hero .sub{font-size:clamp(15px,4vw,18px);}
  .panel{border-radius:16px;}
  .panel-head{padding:15px 14px;}
  .panel-head h2{font-size:20px;}
  .panel-body{padding:14px;}
  .side,.main{padding:13px;}
  .settings{grid-template-columns:minmax(0,1fr);}
  .setting{min-width:0;}
  .action-row{display:grid;grid-template-columns:minmax(0,1fr);}
  .action-row .btn{width:100%;min-width:0;}
  .question-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .question-actions #checkBtn{grid-column:1/-1;grid-row:1;}
  .question-actions .btn{width:100%;min-width:0;padding:11px 7px;font-size:15px;}
  .question-prompt{font-size:clamp(19px,5vw,23px);line-height:1.6;}
  .option-grid{grid-template-columns:minmax(0,1fr);}
  .image-option-grid{grid-template-columns:minmax(0,1fr);}
  .image-option img{height:auto;max-height:260px;}
  .match-board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
  .match-col{min-width:0;gap:9px;}
  .match-card{font-size:clamp(14px,3.8vw,18px);min-height:90px;padding:8px 5px;}
  .match-image{height:85px;max-width:100%;}
  .nav-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;}
  .nav-grid button{min-width:0;padding:8px 1px;font-size:15px;}
  .group-grid{grid-template-columns:minmax(0,1fr);}
  .chip,.order-item,.dragfill-chip{max-width:100%;overflow-wrap:anywhere;}
  .inline-input{width:104px;max-width:35vw;font-size:18px;}
  .q-media{width:auto;max-width:100%;height:auto;max-height:320px;}
  .result-score{font-size:clamp(28px,8vw,40px);}
}

@media (max-width:380px){
  body{font-size:17px;}
  .app{padding-inline:6px;}
  .panel-head h2{font-size:18px;}
  .side,.main{padding:10px;}
  .question-actions .btn{font-size:14px;}
  .match-card{font-size:13px;padding:7px 3px;}
  .match-image{height:72px;}
  .nav-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
}

const QUESTIONS=[{"id":1,"type":"mcq","prompt":"Từ nào dưới đây không cùng nhóm với các từ còn lại?","options":[["A","chăm chỉ"],["B","thầy cô"],["C","bạn bè"],["D","học sinh"]],"correct":"A"},{"id":2,"type":"mcq","prompt":"Từ nào dưới đây có nghĩa giống với từ \"thành thạo\"?","options":[["A","học hỏi"],["B","kinh nghiệm"],["C","phấn đấu"],["D","thuần thục"]],"correct":"D"},{"id":3,"type":"mcq","prompt":"Từ nào dưới đây viết sai chính tả?","options":[["A","duy nhất"],["B","di chuyển"],["C","ranh giới"],["D","kì riệu"]],"correct":"D"},{"id":4,"type":"mcq-image","prompt":"Hình ảnh nào có thể minh hoạ cho đoạn thơ sau?<span class=\"pdf-poem\">Mặt trời thả nắng vàng tươi\nXuyên qua tầng lá đẹp ngời ánh dương\nRừng cây sáng sớm còn vương\nTiếng rơi tí tách của sương trong lành.\n(Theo Trà My)</span>","imageOptions":[["A","Cánh đồng dưới ánh bình minh","q4_a"],["B","Đàn ngựa phi giữa đồng cỏ","q4_b"],["C","Rừng cây với ánh nắng xuyên qua tầng lá","q4_c"]],"correct":"C"},{"id":5,"type":"mcq","prompt":"Tiếng \"hoàn\" có thể ghép với tiếng nào dưới đây để tạo thành động từ?","options":[["A","toàn"],["B","thành"],["C","mĩ"],["D","hảo"]],"correct":"B"},{"id":6,"type":"mcq","prompt":"Từ nào dưới đây có nghĩa là \"coi trọng, do thừa nhận có giá trị cao\"?","options":[["A","gần gũi"],["B","hiền hậu"],["C","thương yêu"],["D","kính trọng"]],"correct":"D"},{"id":7,"type":"mcq","prompt":"Câu thơ nào dưới đây có sử dụng biện pháp nghệ thuật nhân hoá?","options":[["A","Trưa nay bỗng thấy ve ngân\nVe ngân trưa nắng quả dần vàng tươi.\n(Trần Đăng Khoa)"],["B","Chẳng đâu bằng chính nhà em\nCó đàn chim sẻ bên thềm líu lo.\n(Đoàn Thị Lam Luyến)"],["C","Việt Nam đẹp khắp trăm miền,\nBốn mùa một sắc trời riêng đất này.\n(Lê Anh Xuân)"],["D","Bình minh vừa tỉnh giấc\nNắng nhuộm hồng núi xanh.\n(Bích Ngọc)"]],"correct":"D"},{"id":8,"type":"mcq","prompt":"Câu thơ nào dưới đây có sử dụng biện pháp nghệ thuật so sánh?","options":[["A","Sau làn mưa bụi tháng Ba\nLá tre bỗng đỏ như là lửa thiêu.\n(Trần Đăng Khoa)"],["B","Cửa sổ còn biết làm thơ\nTiếng chim cùng ánh nắng ùa vào em.\n(Phan Thị Thanh Nhàn)"],["C","Cơn mưa rả rích đêm hè\nGió đưa mát lạnh bốn bề không gian.\n(Nguyễn Trọng Hoàn)"],["D","Nắng lặn vào trong mùi thơm\nCủa trăm ngàn bông hoa cúc.\n(Xuân Quỳnh)"]],"correct":"A"},{"id":9,"type":"mcq","prompt":"Câu văn nào sử dụng biện pháp so sánh miêu tả đúng sự vật trong bức tranh dưới đây?","options":[["A","Những cây nấm mọc lên sau mưa, xoè rộng như một chiếc ô tí hon."],["B","Mấy cô gái miền núi đeo gùi đi hái nấm trong rừng."],["C","Sau cơn mưa, dưới tầng đất ẩm, nấm mọc lên san sát."],["D","Những cây nấm tai mèo mọc đầy trên những cành cây mục."]],"correct":"A","media":"q9_mushrooms"},{"id":10,"type":"mcq","prompt":"Đọc đoạn thơ sau và cho biết tác giả muốn nói điều gì?<span class=\"pdf-poem\">Trăm cây từ đất sinh ra\nĐể cho quả ngọt, cho hoa muôn màu\nEm đi đâu, em về đâu\nCây xoè bóng mát che đầu cho em...\n(Xuân Quỳnh)</span>","options":[["A","Sự đa dạng của cây xanh ở nước ta"],["B","Ý nghĩa, tầm quan trọng của cây xanh đối với con người"],["C","Sự tàn phá của con người đối với cây xanh"],["D","Vẻ đẹp tươi mát, tràn đầy sức sống của cây xanh"]],"correct":"B"},{"id":11,"type":"mcq","prompt":"Trên đường đi học về, Nam thấy các em nhỏ đi dàn hàng ngang trên đường nên muốn nhắc nhở. Trong trường hợp này, Nam nên nói như thế nào?","options":[["A","Các em nên đi đúng làn đường, đừng đi dàn hàng ngang!"],["B","Các em đi học có vui không?"],["C","Các em nên tuân thủ đúng hiệu lệnh đèn giao thông!"],["D","Các em nên đi xe đạp về nhà cho nhanh!"]],"correct":"A","media":"q11_road"},{"id":12,"type":"mcq","prompt":"Hình ảnh sau gợi nhắc đến câu tục ngữ nào?","options":[["A","Đói cho sạch, rách cho thơm."],["B","Ăn kĩ no lâu, cày sâu tốt lúa."],["C","Gần mực thì đen, gần đèn thì rạng."],["D","Muốn biết phải hỏi, muốn giỏi phải học."]],"correct":"C","media":"q12_proverb"},{"id":13,"type":"mcq","prompt":"Từ nào thích hợp điền vào chỗ trống để hoàn thành câu văn miêu tả hình ảnh sau?<span class=\"pdf-poem\">Con đường làng [...] nằm giữa hai bờ lúa xanh đang trổ đòng thơm ngát.</span>","options":[["A","mấp mô"],["B","khúc khuỷu"],["C","lầy lội"],["D","thẳng tắp"]],"correct":"D","media":"q13_village"},{"id":14,"type":"mcq","prompt":"Câu tục ngữ nào dưới đây đề cao giá trị của con người?","options":[["A","Một nụ cười bằng mười thang thuốc bổ."],["B","Một kho vàng chẳng bằng một nang chữ."],["C","Một mặt người bằng mười mặt của."],["D","Một giọt máu đào hơn ao nước lã."]],"correct":"C"},{"id":15,"type":"mcq","prompt":"Câu văn nào dưới đây sử dụng biện pháp so sánh và nhân hoá miêu tả đúng hình ảnh dưới đây?","options":[["A","Luỹ tre như một mái nhà xanh biếc, che mát cho bác trâu nằm nghỉ ngơi."],["B","Trưa hè đầy nắng, bác trâu già nằm nghỉ ngơi, nhai cỏ dưới bóng tre."],["C","Mặt trời thả những tia nắng vàng chói chang xuống cánh đồng xanh mướt."],["D","Những đám mây bàng bạc trôi lơ lửng trên bầu trời trong xanh của mùa hạ."]],"correct":"A","media":"q15_buffalo"},{"id":16,"type":"mcq","prompt":"Câu văn nào dưới đây mô tả đúng bức tranh sau?","options":[["A","Những cơn gió thổi nghiêng cành lá, cuốn bụi bay mịt mù."],["B","Những tia chớp loé sáng, rạch ngang bầu trời đen kịt."],["C","Mưa rơi rào rào trên sân gạch, vỗ ầm ầm trên mái nhà."],["D","Mưa rơi lộp bộp trên những tàu lá chuối xanh mướt."]],"correct":"B","media":"q16_lightning"},{"id":17,"type":"mcq","prompt":"Đọc đoạn văn dưới đây và chọn đáp án đúng.<span class=\"pdf-poem\">(1) Chiếc ghe của chúng tôi chèo dọc con kinh nhỏ, hai bên bờ là hàng đước <b>rậm rạp</b>, che cả khoảng trời trước mắt như một mái vòm xanh mướt. (2) Trong rừng đước, tiếng chim hót <b>líu lo</b>, tiếng mái chèo khua lõm bõm, tiếng quả bần rơi \"tõm\" xuống kinh kết hợp với nhau thành một bản nhạc <b>thú vị</b>, đặc trưng của miền Tây sông nước. (3) Đối với chúng tôi, nơi đây như một thế giới vừa mới lạ, diệu kì lại vừa gần gũi, <b>mộc mạc</b> đến bình yên.\n(Theo Trà My)</span>","options":[["A","Câu văn số 3 có sử dụng biện pháp nhân hoá."],["B","Tất cả các từ in đậm đều là động từ."],["C","Đoạn văn có một câu sử dụng biện pháp so sánh."],["D","Tất cả các từ in đậm đều là tính từ."]],"correct":"D"},{"id":18,"type":"fields","prompt":"Điền dấu câu thích hợp vào chỗ trống:","inlinePrompt":"Điền dấu câu thích hợp vào chỗ trống:<span class=\"pdf-poem\">Ôi, bức tranh này đẹp quá [[0]]\nChúng em được đến tham quan làng tranh Đông Hồ [[1]]\nLàng tranh Đông Hồ ở tỉnh nào của nước ta [[2]]</span>","correct":["!",".","?"]},{"id":19,"type":"fields","prompt":"Chọn từ thích hợp trong ngoặc đơn điền vào chỗ trống:","inlinePrompt":"Chọn từ thích hợp trong ngoặc đơn điền vào chỗ trống:<span class=\"pdf-poem\">(đã, sẽ, đang)\nLớp chúng em [[0]] được đi dã ngoại nếu cuối tuần trời không mưa.\nEm [[1]] hoàn thành xong bài tập từ tối hôm qua.\nBạn Lan [[2]] quét sân thì thấy mẹ đi làm về.</span>","correct":["sẽ","đã","đang"]},{"id":20,"type":"fields","prompt":"Điền cặp từ có nghĩa trái ngược nhau để hoàn thành câu tục ngữ sau.","inlinePrompt":"Điền cặp từ có nghĩa trái ngược nhau để hoàn thành câu tục ngữ sau.<span class=\"pdf-poem\">Lá [[0]] đùm lá [[1]].</span>","correct":["lành","rách"]},{"id":21,"type":"fill","prompt":"Điền số thích hợp vào chỗ trống:","inlinePrompt":"Điền số thích hợp vào chỗ trống:<span class=\"pdf-poem\">Bến Tre dừa ngọt sông dài,\nNơi chợ Mỏ Cày có kẹo nổi danh.\nCâu ca dao trên có [[0]] danh từ riêng.</span>","correct":["2"],"placeholder":"Nhập số"},{"id":22,"type":"fill","prompt":"Điền số thích hợp vào chỗ trống:","inlinePrompt":"Điền số thích hợp vào chỗ trống:<span class=\"pdf-poem\">Con sông dài tha thướt\nNâng nhẹ áng mây qua\nCánh đồng xanh hiền hoà\nNgân lời ru êm ái.\n(Theo My Linh)\nĐoạn thơ trên có [[0]] tính từ.</span>","correct":["6"],"placeholder":"Nhập số"},{"id":23,"type":"fill","prompt":"Điền số thích hợp vào chỗ trống:","inlinePrompt":"Điền số thích hợp vào chỗ trống:<span class=\"pdf-poem\">Từ các tiếng \"trung, chân, sự, thực\" có thể ghép được tất cả [[0]] từ.</span>","correct":["4"],"placeholder":"Nhập số"},{"id":24,"type":"fields","prompt":"Điền từ thích hợp vào chỗ trống:","inlinePrompt":"Điền từ thích hợp vào chỗ trống:<span class=\"pdf-poem\">Tôi lớn lên đã thấy dừa trước ngõ\nDừa ru tôi giấc ngủ tuổi thơ\nCứ mỗi chiều nghe dừa gieo trước gió\nTôi hỏi nội tôi: “Dừa có tự bao giờ?”.\n(Theo Lê Anh Xuân)\nTừ viết sai chính tả trong đoạn thơ trên là từ [[0]], sửa lại là [[1]].</span>","correct":["gieo","reo"]},{"id":25,"type":"fill","prompt":"Giải câu đố sau:","inlinePrompt":"Giải câu đố sau:<span class=\"pdf-poem\">Giữ nguyên sưởi ấm muôn nơi\nBỏ dấu chăm chỉ mọi người đều khen.\nTừ giữ nguyên là từ gì?\nĐáp án: từ [[0]].</span>","correct":["nắng"],"placeholder":"Nhập từ"},{"id":26,"type":"match","prompt":"Đọc văn bản sau và ghép nội dung ở cột bên trái với nội dung tương ứng ở cột bên phải.<span class=\"pdf-poem\">Thế là kì nghỉ hè đã kết thúc. Nắng thu đã toả vàng khắp nơi thay cho những tia nắng hè gay gắt. Gió thổi mát rượi, đuổi những chiếc lá rụng chạy lao xao. Lá như cũng biết nô đùa, cứ quấn theo chân các bạn học sinh đang đi vội vã. Bạn thì đi với bố, bạn thì đi với mẹ, có bạn lại đi một mình. Ai cũng vội đến trường để gặp lại thầy cô, bạn bè, gặp lại bàn ghế thân quen.\n(Theo Hạnh Minh)</span>","left":[["wind","Gió"],["sun","Nắng thu"],["students","Các bạn học sinh"],["leaves","Lá"]],"right":[["r_sun","toả vàng khắp nơi."],["r_wind","thổi mát rượi, đuổi những chiếc lá rụng chạy lao xao."],["r_students","đi đến trường để gặp lại thầy cô, bạn bè."],["r_leaves","quấn theo chân các bạn học sinh."]],"correct":{"wind":"r_wind","sun":"r_sun","students":"r_students","leaves":"r_leaves"}},{"id":27,"type":"order","prompt":"Sắp xếp các tiếng sau thành câu văn hoàn chỉnh.","items":[["le","lễ"],["chung","Chúng"],["den","đến"],["truong","trường"],["em","em"],["giang","giảng."],["du","dự"],["khai","khai"]],"correct":["chung","em","den","truong","du","le","khai","giang"]},{"id":28,"type":"order","prompt":"Sắp xếp các câu sau thành một đoạn văn hoàn chỉnh.","items":[["after","Ngay sau đó, mây đen kéo đến, che kín bầu trời, sấm chớp ì ầm đằng xa."],["rain","Rồi cơn mưa ào xuống như trút nước."],["drops","Những giọt mưa đổ rào rào trên mái nhà, gõ lộp bộp lên tàu lá chuối."],["rainbow","Vậy mà chỉ một lúc sau, mưa đã tạnh, bầu trời quang đãng và sạch sẽ như gương, chiếc cầu vồng rực rỡ lại xuất hiện ở cuối chân trời xa xa."],["begin","Chiều hè đang oi nóng thì bỗng đâu một làn gió mát thổi qua, lay mạnh cây cối, cuốn bụi mù mịt."]],"correct":["begin","after","rain","drops","rainbow"]},{"id":29,"type":"group","prompt":"Hãy xếp các từ ngữ vào nhóm thích hợp.","items":[["visit","thăm hỏi"],["congrats","chúc mừng"],["post","bưu điện"],["devoted","tận tuỵ"],["teach","giảng dạy"],["advanced","tiên tiến"],["library","thư viện"],["school","ngôi trường"],["kind","hiền hậu"]],"groups":[["noun","Danh từ"],["verb","Động từ"],["adj","Tính từ"]],"correct":{"visit":"verb","congrats":"verb","post":"noun","devoted":"adj","teach":"verb","advanced":"adj","library":"noun","school":"noun","kind":"adj"}},{"id":30,"type":"group","prompt":"Hãy xếp các cặp từ vào nhóm thích hợp.","items":[["near","gần gũi - thân thiết"],["discuss","bàn bạc - thảo luận"],["dark","sáng sủa - u tối"],["decisive","dứt khoát - lưỡng lự"],["quick","vội vàng - thong thả"],["save","tiết kiệm - dành dụm"]],"groups":[["opposite","Cặp từ có nghĩa trái ngược nhau"],["same","Cặp từ có nghĩa giống nhau"]],"correct":{"near":"same","discuss":"same","dark":"opposite","decisive":"opposite","quick":"opposite","save":"same"}}];
let state={idx:0,order:[],answers:{},shuffle:false,remaining:1800,timer:null,selected:null};
let dragged=null,draggedGroup=null,matchDrag=null,dragFillItem=null;
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').normalize('NFC').trim().toLocaleLowerCase('vi').replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffleArray=arr=>[...arr].sort(()=>Math.random()-.5);
function A(q){return state.answers[q.id]||(state.answers[q.id]={});}
function current(){return QUESTIONS.find(q=>q.id===state.order[state.idx]);}
function startGame(ordered){
  state.shuffle=$('shuffleAnswers').checked;
  state.order=QUESTIONS.map(q=>q.id);
  if(!ordered&&$('shuffleQuestions').checked)state.order=shuffleArray(state.order);
  QUESTIONS.forEach(q=>{
    delete q._opts;delete q._imageOptions;delete q._right;delete q._items;
    if(state.shuffle){
      if(q.options)q._opts=shuffleArray(q.options);
      if(q.imageOptions)q._imageOptions=shuffleArray(q.imageOptions);
      if(q.right)q._right=shuffleArray(q.right);
      if(q.type==='group'||q.type==='dragfill')q._items=shuffleArray(q.items);
      if(q.type==='order')q._items=shuffleArray(q.items);
    }
  });
  state.idx=0;state.answers={};state.selected=null;state.remaining=$('timerOn').checked?1800:0;
  $('startScreen').hidden=true;$('gameScreen').hidden=false;
  const brand=document.querySelector('.brand');if(brand)brand.hidden=true;
  $('timer').textContent='30:00';render();if(state.remaining)tick();
}
function tick(){clearInterval(state.timer);state.timer=setInterval(()=>{
  state.remaining--;let m=Math.floor(state.remaining/60),s=state.remaining%60;
  $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(state.remaining<=0){clearInterval(state.timer);submitGame(true);}
},1000)}
function renderInlinePrompt(q,a){
  return q.inlinePrompt.replace(/\[\[(\d+)\]\]/g,(_,n)=>{
    const i=Number(n),v=q.type==='fields'?(a.fields?.[i]||''):(a.fields?.[i]??a.value??'');
    return `<input class="inline-input" aria-label="Chỗ trống ${i+1}" value="${esc(v)}" placeholder="……" ${a.checked?'disabled':''} oninput="setInline(${i},this.value)">`;
  });
}
function setInline(i,value){let q=current(),a=A(q);if(a.checked)return;a.fields=a.fields||{};a.fields[i]=value;}
function matchContent(q,side,id,label){
  const key=q.matchImages?.[side]?.[id];
  return key?`<img class="match-image" draggable="false" src="${IMG[key]}" alt="${esc(label)}">`:`<span>${esc(label)}</span>`;
}
function render(){
  const q=current(),a=A(q);
  $('progressText').textContent=Object.values(state.answers).filter(x=>x.checked).length+'/30';
  $('progressBar').style.width=((state.idx+1)/30*100)+'%';
  $('navGrid').innerHTML=state.order.map((id,i)=>`<button class="${i===state.idx?'active':''} ${state.answers[id]?.checked?'done':''}" onclick="go(${i})">${id}</button>`).join('');
  let prompt=q.inlinePrompt?renderInlinePrompt(q,a):q.prompt;
  let h=`<div class="question-heading"><span class="q-number">CÂU ${q.id} / 30</span><span class="muted">10 điểm</span></div><div class="question-prompt">${prompt}</div>`;
  if(q.helpText)h+=`<div class="help">${esc(q.helpText)}</div>`;
  if(q.media)h+=`<img class="q-media" src="${IMG[q.media]}" alt="Hình minh họa câu ${q.id}">`;
  if(q.type==='mcq'||q.type==='multi'){
    const opts=q._opts||q.options;
    h+=`<div class="option-grid">${opts.map(([id,t])=>`<label class="option ${((a.choice||[]).includes(id)||a.choice===id)?'selected':''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="q${q.id}" value="${id}" ${((a.choice||[]).includes(id)||a.choice===id)?'checked':''} ${a.checked?'disabled':''} onchange="choose('${id}',${q.type==='multi'})"><span class="option-letter">${id}.</span><span>${esc(t).replace(/\n/g,'<br>')}</span></label>`).join('')}</div>`;
  }
  if(q.type==='mcq-image'){
    const opts=q._imageOptions||q.imageOptions;
    h+=`<div class="image-option-grid">${opts.map(([id,label,key])=>`<label class="image-option ${a.choice===id?'selected':''}" aria-label="Đáp án ${id}"><input type="radio" name="q${q.id}" value="${id}" ${a.choice===id?'checked':''} ${a.checked?'disabled':''} onchange="choose('${id}',false)"><img src="${IMG[key]}" alt="${esc(label||('Phương án '+id))}"><span class="option-letter">${id}</span></label>`).join('')}</div>`;
  }
  if(q.type==='fill'&&!q.inlinePrompt)h+=`<div class="answer-line"><label class="field-label">Đáp án của em</label><input class="text-input" id="fillAnswer" value="${esc(a.value||'')}" placeholder="${esc(q.placeholder||'Nhập đáp án')}" ${a.checked?'disabled':''} oninput="A(current()).value=this.value"></div>`;
  if(q.type==='fields'&&!q.inlinePrompt)h+=`<div class="subpart-list">${q.fields.map((f,i)=>`<div class="answer-line"><label class="field-label">${esc(f)}</label><input class="text-input" value="${esc(a.fields?.[i]||'')}" ${a.checked?'disabled':''} oninput="A(current()).fields=A(current()).fields||{};A(current()).fields[${i}]=this.value"></div>`).join('')}</div>`;
  if(q.type==='match'){
    const right=q._right||q.right;
    h+=`<div class="match-help">Kéo từ cạnh ô bên trái sang ô tương ứng bên phải để nối. Em cũng có thể chạm ô bên trái rồi chạm ô bên phải. Muốn đổi, hãy nối lại.</div>
    <div class="match-board" id="matchBoard"><div class="match-col">${q.left.map(([id,t])=>`<div class="match-card ${a.matches?.[id]?'matched':''} ${state.selected===id?'selected':''}" data-side="left" data-id="${id}" onpointerdown="beginMatchDrag(event,'${id}')" onclick="pickLeft('${id}')">${matchContent(q,'left',id,t)}</div>`).join('')}</div>
    <svg class="match-svg" id="matchSvg" aria-hidden="true"></svg>
    <div class="match-col">${right.map(([id,t])=>`<div class="match-card ${Object.values(a.matches||{}).includes(id)?'matched':''}" data-side="right" data-id="${id}" onclick="pickRight('${id}')">${matchContent(q,'right',id,t)}</div>`).join('')}</div></div>
    <div class="help">Đã nối: ${Object.keys(a.matches||{}).length}/${q.left.length}</div>`;
  }
  if(q.type==='group'){
    const items=q._items||q.items;
    h+=`<div class="help">Kéo thẻ từ vào nhóm phù hợp. Có thể kéo thẻ về khu vực từ cho sẵn để xếp lại. Trên điện thoại, chạm thẻ rồi chạm nhóm; chạm thẻ đã xếp để trả về.</div>
    <div class="group-bank" data-group-bank ondragover="allowDrop(event)" ondrop="dropGroupToBank(event)">${items.filter(([id])=>!a.groups?.[id]).map(([id,t])=>`<span class="chip ${state.selected===id?'selected':''}" draggable="true" ondragstart="dragGroup(event,'${id}')" onclick="pickGroup('${id}')">${esc(t)}</span>`).join('')||'<span class="muted">Đã xếp hết các từ.</span>'}</div>
    <div class="group-grid">${q.groups.map(([gid,label])=>`<div class="dropzone" data-gid="${gid}" ondragover="allowDrop(event)" ondrop="dropGroupTo(event,'${gid}')" onclick="placeGroup('${gid}')"><h4>${esc(label)}</h4>${items.filter(([id])=>a.groups?.[id]===gid).map(([id,t])=>`<span class="chip" draggable="true" ondragstart="dragGroup(event,'${id}')" onclick="event.stopPropagation();returnGroup('${id}')">${esc(t)}</span>`).join('')}</div>`).join('')}</div>`;
  }
  if(q.type==='order'){
    const items=q._items||q.items;if(!a.order)a.order=items.map(x=>x[0]);const arr=a.order;
    h+=`<div class="help">Kéo thẻ để sắp xếp. Trên điện thoại, chạm hai thẻ liên tiếp để đổi vị trí.</div><div class="order-list">${arr.map(id=>`<span class="order-item ${state.selected===id?'selected':''}" draggable="true" ondragstart="dragOrder(event,'${id}')" ondragover="event.preventDefault()" ondrop="dropOrder(event,'${id}')" onclick="tapOrder('${id}')">${esc(items.find(x=>x[0]===id)?.[1]||q.items.find(x=>x[0]===id)?.[1]||'')}</span>`).join('')}</div>`;
  }
  if(q.type==='dragfill'){
    const items=q._items||q.items;
    h+=`<div class="help">Kéo từ ở ngân hàng từ vào chỗ trống tương ứng. Trên điện thoại, chạm một thẻ từ rồi chạm vào ô trống. Chạm từ đã điền để đưa trở lại ngân hàng.</div>
    <div class="dragfill-list">${q.slots.map(([sid,label])=>`<div class="dragfill-row"><span>${esc(label)}</span><span class="dragfill-slot ${a.dragfills?.[sid]?'filled':''}" data-slot="${sid}" ondragover="allowDrop(event)" ondrop="dropFillTo(event,'${sid}')" onclick="tapFillSlot('${sid}')">${a.dragfills?.[sid]?`<span class="dragfill-chip">${esc(items.find(x=>x[0]===a.dragfills[sid])?.[1]||'')}</span>`:'……'}</span>.</div>`).join('')}</div>
    <div class="dragfill-bank" ondragover="allowDrop(event)" ondrop="dropFillToBank(event)">${items.filter(([id])=>!Object.values(a.dragfills||{}).includes(id)).map(([id,t])=>`<span class="dragfill-chip ${state.selected===id?'selected':''}" draggable="true" ondragstart="dragFill(event,'${id}')" onclick="pickFill('${id}')">${esc(t)}</span>`).join('')}</div>`;
  }
  $('questionContent').innerHTML=h;$('feedback').innerHTML=a.checked?feedback(q):'';
  $('checkBtn').disabled=!!a.checked;$('checkBtn').textContent=a.checked?'ĐÃ KIỂM TRA':'✓ KIỂM TRA ĐÁP ÁN';
  $('prevBtn').disabled=state.idx===0;$('nextBtn').disabled=state.idx===29;
  if(q.type==='match')requestAnimationFrame(()=>drawLines(q));
}
function choose(id,multi){let a=A(current());if(a.checked)return;if(multi){a.choice=a.choice||[];a.choice=a.choice.includes(id)?a.choice.filter(x=>x!==id):[...a.choice,id];}else a.choice=id;render();}
function pickLeft(id){if(A(current()).checked)return;state.selected=id;render();}
function pickRight(id){let q=current(),a=A(q);if(a.checked||!state.selected)return;connectMatch(state.selected,id);}
function connectMatch(leftId,rightId){let q=current(),a=A(q);if(a.checked)return;a.matches=a.matches||{};for(const k in a.matches)if(k===leftId||a.matches[k]===rightId)delete a.matches[k];a.matches[leftId]=rightId;state.selected=null;matchDrag=null;render();}
function beginMatchDrag(e,id){if(A(current()).checked)return;matchDrag={id};state.selected=id;}
function drawLines(q){
  const svg=$('matchSvg'),board=$('matchBoard');if(!svg||!board)return;
  const b=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);svg.innerHTML='';
  const left=board.querySelectorAll('.match-card[data-side="left"]'),right=board.querySelectorAll('.match-card[data-side="right"]');
  const a=A(q);
  Object.entries(a.matches||{}).forEach(([lid,rid])=>{
    const l=[...left].find(el=>el.dataset.id===lid),r=[...right].find(el=>el.dataset.id===rid);if(!l||!r)return;
    const lr=l.getBoundingClientRect(),rr=r.getBoundingClientRect();
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',lr.right-b.left);line.setAttribute('y1',lr.top+lr.height/2-b.top);
    line.setAttribute('x2',rr.left-b.left);line.setAttribute('y2',rr.top+rr.height/2-b.top);svg.appendChild(line);
  });
}
function drawTempLine(x,y){
  if(!matchDrag)return;const svg=$('matchSvg'),board=$('matchBoard');if(!svg||!board)return;
  const card=board.querySelector(`.match-card[data-side="left"][data-id="${matchDrag.id}"]`);if(!card)return;
  const b=board.getBoundingClientRect(),r=card.getBoundingClientRect();
  let line=svg.querySelector('.temp-line');if(!line){line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','temp-line');svg.appendChild(line);}
  line.setAttribute('x1',r.right-b.left);line.setAttribute('y1',r.top+r.height/2-b.top);line.setAttribute('x2',x-b.left);line.setAttribute('y2',y-b.top);
}
document.addEventListener('pointermove',e=>{if(matchDrag)drawTempLine(e.clientX,e.clientY);});
document.addEventListener('pointerup',e=>{
  if(!matchDrag)return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.match-card[data-side="right"]');
  if(target&&$('matchBoard')?.contains(target)){connectMatch(matchDrag.id,target.dataset.id);return;}
  matchDrag=null;const q=current();if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));
});
function pickGroup(id){if(A(current()).checked)return;state.selected=id;render();}
function placeGroup(gid){let q=current(),a=A(q);if(!state.selected||a.checked)return;a.groups=a.groups||{};a.groups[state.selected]=gid;state.selected=null;render();}
function returnGroup(id){let a=A(current());if(a.checked)return;delete a.groups?.[id];state.selected=null;render();}
function allowDrop(e){e.preventDefault();}
function dragGroup(e,id){if(A(current()).checked){e.preventDefault();return;}draggedGroup=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}
function dropGroupTo(e,gid){e.preventDefault();let a=A(current()),id=draggedGroup||state.selected;if(!id||a.checked)return;a.groups=a.groups||{};a.groups[id]=gid;draggedGroup=null;state.selected=null;render();}
function dropGroupToBank(e){e.preventDefault();let a=A(current()),id=draggedGroup||state.selected;if(!id||a.checked)return;if(a.groups)delete a.groups[id];draggedGroup=null;state.selected=null;render();}
function tapOrder(id){if(A(current()).checked)return;if(!state.selected){state.selected=id;render();return;}let q=current(),a=A(q),items=q._items||q.items,arr=a.order||items.map(x=>x[0]),i=arr.indexOf(state.selected),j=arr.indexOf(id);if(i>=0&&j>=0)[arr[i],arr[j]]=[arr[j],arr[i]];a.order=arr;state.selected=null;render();}
function dragOrder(e,id){if(A(current()).checked){e.preventDefault();return;}dragged=id;e.dataTransfer.setData('text/plain',id);}
function dropOrder(e,id){e.preventDefault();let q=current(),a=A(q),items=q._items||q.items,arr=a.order||items.map(x=>x[0]),from=arr.indexOf(dragged),to=arr.indexOf(id);if(from>=0&&to>=0){arr.splice(to,0,arr.splice(from,1)[0]);a.order=arr;}dragged=null;render();}
function pickFill(id){if(A(current()).checked)return;state.selected=id;render();}
function dragFill(e,id){if(A(current()).checked){e.preventDefault();return;}dragFillItem=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}
function placeFill(slotId){let q=current(),a=A(q),id=dragFillItem||state.selected;if(!id||a.checked)return;a.dragfills=a.dragfills||{};for(const k of Object.keys(a.dragfills))if(a.dragfills[k]===id)delete a.dragfills[k];a.dragfills[slotId]=id;dragFillItem=null;state.selected=null;render();}
function tapFillSlot(slotId){let a=A(current());if(a.checked)return;if(state.selected){placeFill(slotId);return;}if(a.dragfills)delete a.dragfills[slotId];render();}
function dropFillTo(e,slotId){e.preventDefault();placeFill(slotId);}
function dropFillToBank(e){e.preventDefault();let q=current(),a=A(q),id=dragFillItem||state.selected;if(!id||a.checked)return;for(const k of Object.keys(a.dragfills||{}))if(a.dragfills[k]===id)delete a.dragfills[k];dragFillItem=null;state.selected=null;render();}
function calc(q,a){
  if(q.manualReview)return null;
  if(q.type==='mcq'||q.type==='mcq-image')return a.choice===q.correct?10:0;
  if(q.type==='multi')return JSON.stringify([...(a.choice||[])].sort())===JSON.stringify([...q.correct].sort())?10:0;
  if(q.type==='fill'){
    const vals=q.correct||[];
    if(q.inlinePrompt){return vals.some(x=>Object.values(a.fields||{}).some(v=>norm(x)===norm(v)))?10:0;}
    return vals.some(x=>norm(x)===norm(a.value))?10:0;
  }
  if(q.type==='fields')return q.correct.reduce((sum,x,i)=>sum+(norm(x)===norm(a.fields?.[i])?10/q.correct.length:0),0);
  if(q.type==='match'){let n=Object.keys(q.correct).length,h=Object.entries(q.correct).filter(([k,v])=>a.matches?.[k]===v).length;return n?h/n*10:0;}
  if(q.type==='group'){const items=q.items||[];const n=items.length;if(!n)return 0;const h=items.filter(([id])=>Object.prototype.hasOwnProperty.call(q.correct,id)&&a.groups?.[id]===q.correct[id]).length;return Math.min(10,Math.max(0,h/n*10));}
  if(q.type==='order'){let arr=a.order||q.items.map(x=>x[0]);return q.correct.reduce((sum,x,i)=>sum+(arr[i]===x?10/q.correct.length:0),0);}
  if(q.type==='dragfill'){const n=q.slots.length;const h=q.slots.filter(([id])=>a.dragfills?.[id]===q.correct[id]).length;return n?h/n*10:0;}
  return 0;
}
function answerText(q){
  if(q.manualReview)return 'Cần giáo viên xác nhận đáp án từ đề gốc.';
  if(q.type==='mcq')return q.options.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='mcq-image')return q.imageOptions.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='multi')return q.correct.join(', ');
  if(q.type==='fill')return q.correct.join(' / ');
  if(q.type==='fields')return q.correct.join(' – ');
  if(q.type==='match')return Object.entries(q.correct).map(([k,v])=>q.left.find(x=>x[0]===k)[1]+' → '+q.right.find(x=>x[0]===v)[1]).join('; ');
  if(q.type==='group')return Object.entries(q.correct).map(([k,v])=>q.items.find(x=>x[0]===k)[1]+' → '+q.groups.find(x=>x[0]===v)[1]).join('; ');
  if(q.type==='order')return q.correct.map(id=>q.items.find(x=>x[0]===id)[1]).join(' ');
  if(q.type==='dragfill')return q.slots.map(([id,label])=>label+' '+q.items.find(x=>x[0]===q.correct[id])[1]).join('; ');
  return '';
}
function reviewPrompt(q){return q.inlinePrompt?q.inlinePrompt.replace(/\[\[\d+\]\]/g,'………'):q.prompt;}
function feedback(q){let a=A(q),p=calc(q,a);if(p===null)return `<div class="feedback wrong"><b>Cần giáo viên xác nhận.</b> Câu này chưa được tính điểm tự động. ${esc(q.reviewNote||'')}</div>`;return `<div class="feedback ${p>=9.99?'':'wrong'}"><b>${p>=9.99?'Chính xác!':'Em đã hoàn thành lượt kiểm tra.'}</b> Điểm câu này: ${p.toFixed(1).replace('.0','')}/10. ${q.explanation||''} ${p<9.99?'<br><b>Đáp án:</b> '+esc(answerText(q)):''}</div>`;}
function checkAnswer(){
  let q=current(),a=A(q);if(a.checked)return;
  if((q.type==='mcq'||q.type==='mcq-image')&&!a.choice){alert('Em hãy chọn đáp án!');return;}
  if(q.type==='multi'&&!a.choice?.length){alert('Em hãy chọn đáp án!');return;}
  if(q.type==='fill'){
    const vals=q.inlinePrompt?Object.values(a.fields||{}):[a.value||''];
    if(!vals.some(v=>String(v).trim())){alert('Em hãy điền đáp án vào chỗ trống!');return;}
  }
  if(q.type==='fields'&&q.correct.some((_,i)=>!a.fields?.[i]?.trim())){alert('Em hãy điền đủ các chỗ trống!');return;}
  if(q.type==='match'&&Object.keys(a.matches||{}).length===0){alert('Em hãy nối các cặp tương ứng!');return;}
  if(q.type==='group'&&Object.keys(a.groups||{}).length===0){alert('Em hãy xếp các từ vào nhóm!');return;}
  if(q.type==='order'&&(a.order||[]).length===0){alert('Em hãy sắp xếp các thẻ!');return;}
  if(q.type==='dragfill'&&q.slots.some(([id])=>!a.dragfills?.[id])){alert('Em hãy điền đủ các chỗ trống!');return;}
  a.checked=true;state.selected=null;render();
}
function move(d){state.idx=Math.max(0,Math.min(29,state.idx+d));state.selected=null;matchDrag=null;dragFillItem=null;render();}
function go(i){state.idx=i;state.selected=null;matchDrag=null;dragFillItem=null;render();}
function submitGame(auto=false){
  if(!$('gameScreen').hidden&&!auto&&!confirm('Em có chắc chắn muốn nộp bài?'))return;
  clearInterval(state.timer);let total=0,full=0,part=0,wrong=0,pending=0;
  QUESTIONS.forEach(q=>{let p=calc(q,A(q));if(p===null){pending++;return;}total+=p;if(p>=9.99)full++;else if(p>0)part++;else wrong++;});
  $('gameScreen').hidden=true;$('resultScreen').hidden=false;
  $('resultBody').innerHTML=`<div class="result-score">${total.toFixed(1).replace('.0','')} / 300 điểm</div><p>Đúng hoàn toàn: <b>${full}</b> câu</p><p>Đúng một phần: <b>${part}</b> câu</p><p>Sai hoặc chưa hoàn thành: <b>${wrong}</b> câu</p><p>Câu cần giáo viên xác nhận: <b>${pending}</b> câu (chưa cộng vào điểm tạm tính)</p><p>Thời gian làm bài: ${$('timer').textContent}</p><hr><h3>Xem lại đáp án</h3>${QUESTIONS.map(q=>{let p=calc(q,A(q));return `<div class="feedback ${p!==null&&p>=9.99?'':'wrong'}"><b>Câu ${q.id} – ${p===null?'Chờ xác nhận':p.toFixed(1).replace('.0','')+'/10'}</b><br>${esc(reviewPrompt(q))}<br><b>Đáp án:</b> ${esc(answerText(q))}${q.manualReview?'<br><b>Ghi chú:</b> '+esc(q.reviewNote):''}</div>`}).join('')}<div class="action-row"><button class="btn primary" onclick="location.reload()">LÀM LẠI BÀI</button></div>`;
}
$('questionContent').addEventListener('click',e=>{
  const zone=e.target.closest('.dropzone');if(zone&&!e.target.closest('.chip')){placeGroup(zone.dataset.gid);return;}
});
window.addEventListener('resize',()=>{let q=current();if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));});
</script></body></html>
